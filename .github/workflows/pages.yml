name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/web/package-lock.json
      - name: Install & build
        working-directory: packages/web
        env:
          VITE_BASE: /kids-literacy-h5/
        run: |
          npm ci
          npm run build
      - name: Attach legacy ESM
        run: |
          cp legacy.html packages/web/dist/legacy.html
          mkdir -p packages/web/dist/packages/web
          cp -R packages/web/legacy packages/web/dist/packages/web/legacy
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
