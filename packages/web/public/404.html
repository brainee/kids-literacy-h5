<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>星星思维乐园</title>
    <script>
      // SPA 回落：GitHub project Pages 保留 1 段（/kids-literacy-h5）；Cloudflare *.pages.dev 保留 0 段
      ;(function () {
        var l = window.location
        var onGhProject =
          /github\.io$/i.test(l.hostname) ||
          l.pathname.split('/').filter(Boolean)[0] === 'kids-literacy-h5'
        var pathSegmentsToKeep = onGhProject ? 1 : 0
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash,
        )
      })()
    </script>
  </head>
  <body></body>
</html>
